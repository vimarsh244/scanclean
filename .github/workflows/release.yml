name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install package and build tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -v
      - name: Build release artifacts
        run: python -m build
      - name: Verify tag matches package version
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(python -c 'import scanclean; print(scanclean.__version__)')"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  pyodide:
    runs-on: ubuntu-22.04
    env:
      PYODIDE_VERSION: "314.0.7"
      PYODIDE_BUILD_VERSION: "0.39.0"
      PYODIDE_RECIPES_COMMIT: "fc8587207ecbf0fb54305d5da25ab7ed70f126d3"
      EMSDK_NUM_CORE: "2"
      EMCC_CORES: "2"
      PYODIDE_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Pyodide build tools
        run: python -m pip install --upgrade pip && python -m pip install "pyodide-build==$PYODIDE_BUILD_VERSION" build
      - name: Install matching Pyodide cross-build environment
        run: pyodide xbuildenv install "$PYODIDE_VERSION"
      - name: Fetch pinned official package recipes
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/pyodide/pyodide-recipes.git "$RUNNER_TEMP/pyodide-recipes"
          git -C "$RUNNER_TEMP/pyodide-recipes" checkout "$PYODIDE_RECIPES_COMMIT"
          python tools/prepare_pyodide_recipe.py "$RUNNER_TEMP/pyodide-recipes/packages/opencv-python/meta.yaml"
      - name: Build ABI-matched OpenCV, NumPy, and Pillow wheels
        shell: bash
        run: |
          pyodide build-recipes opencv-python Pillow \
            --recipe-dir "$RUNNER_TEMP/pyodide-recipes/packages" \
            --build-dir "$RUNNER_TEMP/pyodide-build" \
            --install-dir "$RUNNER_TEMP/pyodide-dist" \
            --install --metadata-files --clean --n-jobs 2
      - name: Build ScanClean wheel
        run: python -m build --wheel
      - name: Assemble locked Pyodide distribution
        shell: bash
        run: |
          python tools/build_pyodide_bundle.py \
            --lock "$RUNNER_TEMP/pyodide-dist/pyodide-lock.json" \
            --wheel-dir "$RUNNER_TEMP/pyodide-dist" \
            --scanclean-wheel "$(find dist -maxdepth 1 -name 'scanclean-*.whl' -print -quit)" \
            --output-dir dist \
            --tag "$GITHUB_REF_NAME"
      - name: Smoke-test OpenCV 5 and the ONNX detector in Pyodide
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/pyodide-node" "pyodide@$PYODIDE_VERSION"
          node tools/test_pyodide_bundle.mjs \
            "dist/scanclean-pyodide-$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/pyodide-node"
      - uses: actions/upload-artifact@v4
        with:
          name: pyodide-distribution
          path: dist/scanclean-pyodide-${{ github.ref_name }}.zip
          if-no-files-found: error

  release:
    needs: [python, pyodide]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release-dist/* --generate-notes --title "$GITHUB_REF_NAME"
