name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install package and build tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -v
      - name: Build release artifacts
        run: python -m build
      - name: Verify tag matches package version
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(python -c 'import scanclean; print(scanclean.__version__)')"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz --generate-notes --title "$GITHUB_REF_NAME"
